version: '3.8'

services:
  onboarding-service:
    build:
      context: ../..
      dockerfile: examples/workflow-employee-onboarding/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
