name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test-root:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/**/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test root module
        run: go test ./...

      - name: Vet root module
        run: go vet ./...

  test-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - examples/todo-ddd
          - examples/game-server
          - examples/event-sourced-wallet
          - examples/workflow-employee-onboarding
          - examples/saga-order-fulfillment/orchestrator
          - examples/saga-order-fulfillment/services/inventory-service
          - examples/saga-order-fulfillment/services/payment-service
          - examples/saga-order-fulfillment/services/shipping-service

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/**/go.sum

      - name: Test example module
        run: go test ./...

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - test-root

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
